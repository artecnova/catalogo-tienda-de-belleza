<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba catálogos</title>
</head>

<body>

<h1>Prueba Firebase</h1>

<p id="resultado">Cargando...</p>


<script type="module">

import { db } from "./firebase-config.js";

import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const resultado = document.getElementById("resultado");


async function probar(){

    try{

        const consulta = await getDocs(collection(db,"catalogos"));

        resultado.innerHTML = 
        "Documentos encontrados: " + consulta.size;


        consulta.forEach((documento)=>{

    resultado.innerHTML += 
    "<br><br>ID: " + documento.id +
    "<br>Datos: " + JSON.stringify(documento.data());

});


    }catch(error){

        console.log(error);

        resultado.innerHTML =
        "Error: " + error;

    }

}


probar();

</script>

</body>
</html>
