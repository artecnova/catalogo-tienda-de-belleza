<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba Firebase</title>
</head>

<body>

<h1>Probando Firebase</h1>

<p id="resultado">Cargando...</p>


<script type="module">

import { db } from "./firebase-config.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


const resultado = document.getElementById("resultado");


async function probar(){

    try{

        const consulta = await getDocs(collection(db,"catalogos"));

        resultado.innerHTML = 
        "Firebase conectado correctamente ✅<br>" +
        "Catálogos encontrados: " + consulta.size;

    }catch(error){

        resultado.innerHTML =
        "Error de conexión ❌<br>" + error;

    }

}


probar();

</script>


</body>
</html>
